<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VibeResearch — Sign in</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background:#0f1117; color:#dbe1ea; min-height:100vh;
         display:flex; align-items:center; justify-content:center; }
  .card { width:340px; background:#161a23; border:1px solid #232838; border-radius:12px;
          padding:26px 24px; box-shadow:0 8px 40px rgba(0,0,0,.4); }
  h1 { font-size:18px; margin:0 0 4px; color:#9db4ff; }
  .sub { font-size:12px; color:#7c869b; margin:0 0 18px; }
  .tabs { display:flex; gap:6px; margin-bottom:16px; }
  .tab { flex:1; text-align:center; padding:7px; border-radius:7px; cursor:pointer;
         background:#232838; color:#9db4ff; font-size:13px; user-select:none; }
  .tab.active { background:#2a5bd7; color:#fff; }
  label { display:block; font-size:12px; color:#9fb0cf; margin:12px 0 4px; }
  input { width:100%; background:#0f1117; border:1px solid #2a3040; color:#dbe1ea;
          padding:8px 10px; border-radius:6px; font-size:14px; }
  button.primary { width:100%; margin-top:18px; background:#2a5bd7; color:#fff; border:0;
                   padding:9px; border-radius:7px; font-size:14px; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  .msg { margin-top:14px; font-size:12.5px; min-height:16px; }
  .msg.err { color:#ff8080; }
  .msg.ok { color:#7ee0a0; }
</style>
</head>
<body>
<div class="card">
  <h1>VibeResearch</h1>
  <p class="sub">Autonomous AI research — sign in to continue.</p>
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="showTab('login')">Sign in</div>
    <div class="tab" id="tab-register" onclick="showTab('register')">Register</div>
  </div>

  <form id="form" onsubmit="return submitForm(event)">
    <label for="username">Username</label>
    <input id="username" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="primary" id="submit" type="submit">Sign in</button>
  </form>
  <div class="msg" id="msg"></div>
</div>

<script>
  let mode = "login";
  function showTab(m) {
    mode = m;
    document.getElementById("tab-login").classList.toggle("active", m === "login");
    document.getElementById("tab-register").classList.toggle("active", m === "register");
    document.getElementById("submit").textContent = m === "login" ? "Sign in" : "Request account";
    document.getElementById("password").autocomplete = m === "login" ? "current-password" : "new-password";
    setMsg("", "");
  }
  function setMsg(text, cls) {
    const el = document.getElementById("msg");
    el.textContent = text; el.className = "msg" + (cls ? " " + cls : "");
  }
  async function submitForm(ev) {
    ev.preventDefault();
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = document.getElementById("submit");
    btn.disabled = true;
    try {
      const url = mode === "login" ? "/api/auth/login" : "/api/auth/register";
      const r = await fetch(url, {
        method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({username, password}),
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { setMsg(data.detail || "request failed", "err"); return false; }
      if (mode === "login") {
        window.location.href = "/";
      } else {
        setMsg("Account requested. An admin must approve it before you can sign in.", "ok");
        showTab("login");
      }
    } catch (e) {
      setMsg("network error", "err");
    } finally {
      btn.disabled = false;
    }
    return false;
  }
</script>
</body>
</html>
