[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoresearch"
version = "0.1.0"
description = "DAGLoop: evidence-bound automated research with component DAG feedback"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "redis>=5.0",
    "aiosqlite>=0.20",
    "bcrypt>=5.0,<6",
    "fastapi>=0.104,<1",
    "jsonschema>=4.20",
    "json-repair>=0.55,<1",
    "pyyaml>=6.0",
    "openai>=1.40",
    "httpx>=0.27",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "scipy>=1.11",
    "numpy>=1.26",
    "uvicorn>=0.31.1,<1",
]

[project.optional-dependencies]
sandbox = [
    "docker==7.1.0",
    "openhands-agent-server==1.29.3",
    "openhands-sdk==1.23.0",
    "openhands-tools==1.23.0",
    "openhands-workspace==1.23.0",
]
test = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio==0.23.8",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
include = ["autoresearch*"]
exclude = ["autoresearch*.tests*"]

[tool.setuptools.package-data]
autoresearch = ["**/*.html", "**/*.json", "**/*.md", "**/*.yaml", "**/*.yml"]

# Pytest config is authoritative in pytest.ini (asyncio_mode=auto, timeout=180).
# Kept out of pyproject to avoid a split/conflicting config (pytest.ini wins when both exist).
